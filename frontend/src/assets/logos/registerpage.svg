<svg width="900" height="650" viewBox="0 0 900 650"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <style>
      .line{
        fill:none;
        stroke:#4a3f46;
        stroke-width:3;
        stroke-linecap:round;
        stroke-linejoin:round;
      }
      .dot{
        fill:none;
        stroke:#6b6066;
        stroke-width:3;
        stroke-dasharray:4 8;
      }
      .accent{
        fill:#F28B54;
        stroke:#F28B54;
      }
      .text{
        fill:#4a3f46;
        font-family:Inter,Arial,sans-serif;
      }
    </style>
  </defs>

  <!-- Logo -->
  <g transform="translate(300 50)">
    <polygon points="0,18 16,0 42,6 48,32 32,50 6,44"
             fill="none"
             stroke="#F28B54"
             stroke-width="5"/>
    <path d="M24 10 L36 38 L29 38 L25 28 L19 28 L15 38 L9 38 Z"
          fill="#F28B54"/>
    <text x="70" y="34"
          class="text"
          font-size="44"
          font-weight="700">
      ActionWatch
    </text>

    <text x="20" y="80"
          class="text"
          font-size="18"
          opacity=".7">
      AI-powered Incident Response Platform
    </text>
  </g>

  <!-- Main Dashboard -->
  <g transform="translate(320 180)">
    <rect x="0" y="0" width="270" height="180"
          rx="8"
          class="line"/>

    <!-- top dots -->
    <circle cx="25" cy="20" r="4" fill="#6b6066"/>
    <circle cx="45" cy="20" r="4" fill="#6b6066"/>
    <circle cx="65" cy="20" r="4" fill="#6b6066"/>

    <line x1="0" y1="40" x2="270" y2="40" class="line"/>

    <!-- graph -->
    <polyline points="
      45,95
      80,65
      110,88
      145,58
      175,82
      205,60
      240,50"
      class="line"/>

    <circle cx="240" cy="50" r="7" class="accent"/>

    <line x1="40" y1="120" x2="250" y2="120" class="line"/>
    <line x1="50" y1="120" x2="50" y2="70" class="line"/>
    <line x1="90" y1="120" x2="90" y2="100" class="line"/>
    <line x1="150" y1="120" x2="150" y2="80" class="line"/>
    <line x1="200" y1="120" x2="200" y2="90" class="line"/>
    <line x1="240" y1="120" x2="240" y2="65" class="line"/>

    <!-- Pie -->
    <circle cx="70" cy="150" r="24" class="line"/>
    <path d="M70 150 L70 126
             A24 24 0 0 1 90 165 Z"
          fill="#F28B54"/>

    <line x1="130" y1="145" x2="220" y2="145" class="line"/>
    <line x1="130" y1="160" x2="210" y2="160" class="line"/>
    <line x1="130" y1="175" x2="190" y2="175" class="line"/>
  </g>

  <!-- Server blocks -->
  <g transform="translate(180 400)">
    <rect x="0" y="0" width="110" height="30" rx="6" class="line"/>
    <rect x="0" y="40" width="110" height="30" rx="6" class="line"/>
    <rect x="0" y="80" width="110" height="30" rx="6" class="line"/>

    <circle cx="18" cy="15" r="3" class="accent"/>
    <circle cx="32" cy="15" r="3" class="accent"/>
    <circle cx="18" cy="55" r="3" class="accent"/>
    <circle cx="32" cy="55" r="3" class="accent"/>
    <circle cx="18" cy="95" r="3" class="accent"/>
    <circle cx="32" cy="95" r="3" class="accent"/>
  </g>

  <!-- Warning box -->
  <g transform="translate(470 390)">
    <rect width="90" height="90" rx="8" class="line"/>
    <polygon points="45,25 65,60 25,60"
             class="line"/>
    <circle cx="45" cy="48" r="2" class="accent"/>
  </g>

  <!-- List card -->
  <g transform="translate(610 330)">
    <rect width="120" height="95" rx="8" class="line"/>
    <circle cx="20" cy="22" r="3" class="accent"/>
    <circle cx="20" cy="42" r="3" class="accent"/>
    <circle cx="20" cy="62" r="3" class="accent"/>

    <line x1="35" y1="22" x2="90" y2="22" class="line"/>
    <line x1="35" y1="42" x2="100" y2="42" class="line"/>
    <line x1="35" y1="62" x2="80" y2="62" class="line"/>
  </g>

  <!-- Bar chart -->
  <g transform="translate(560 470)">
    <rect width="180" height="120" rx="8" class="line"/>

    <rect x="45" y="70" width="20" height="40" class="line"/>
    <rect x="80" y="50" width="20" height="60" class="line"/>
    <rect x="115" y="30" width="20" height="80" class="line"/>
    <rect x="150" y="10" width="20" height="100"
          fill="#F28B54"
          stroke="#4a3f46"
          stroke-width="3"/>
  </g>

  <!-- Connectors -->
  <path d="M320 270 H250 V430"
        class="dot"/>
  <path d="M590 270 H650 V330"
        class="dot"/>
  <path d="M455 360 V390"
        class="dot"/>
  <path d="M455 480 H620"
        class="dot"/>
  <path d="M235 510 H470"
        class="dot"/>

  <!-- Decorative squares -->
  <rect x="165" y="420" width="10" height="10" class="line"/>
  <rect x="730" y="250" width="10" height="10" class="line"/>
  <rect x="420" y="560" width="10" height="10" class="line"/>

  <!-- Footer -->
  <g transform="translate(250 620)">
    <circle cx="0" cy="0" r="10"
            fill="none"
            stroke="#8c6c6c"
            stroke-width="3"/>
    <path d="M-4 0 L-1 4 L5 -4"
          fill="none"
          stroke="#8c6c6c"
          stroke-width="3"/>
    <text x="25"
          y="6"
          class="text"
          font-size="20"
          opacity=".8">
      Trusted for monitoring modern infrastructure.
    </text>
  </g>

</svg>